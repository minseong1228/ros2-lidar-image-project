image_publisher:
  ros__parameters:
    mode: "RANGE"        
    # [학생 정의 파라미터 1 & 2] ROI 및 필터링을 위한 커스텀 거리 설정
    roi_min_dist: 1.0      
    roi_max_dist: 30.0     

    range_image:
      width:  1024
      height: 64

    bev:
      min_x: -40.0
      max_x:  40.0
      min_y: -40.0
      max_y:  40.0
      cell_size: 0.1
